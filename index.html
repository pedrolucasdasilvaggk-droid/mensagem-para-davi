<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Davi ❤️</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(135deg,#101827,#511b43);
}
.card {
    padding: 35px 20px;
    margin: 20px;
    border-radius: 20px;
    background: rgba(255,255,255,.09);
}
.heart { font-size: 75px; }
h1 { color: #ff75a9; }
p { font-size: 19px; }
.author { margin-top: 35px; color: #ffd1e1; }
</style>
</head>
<body>
<div class="card">
    <div class="heart">❤️</div>
    <h1>Meu amigo Davi, te amo!</h1>
    <p>Você é um amigo muito especial!</p>
    <p class="author">Com carinho,<br><strong>Pedro Lucas</strong></p>
</div>
</body>
</html>
